name: Build and Push Images

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:
  schedule:
    - cron: '0 0 * * *'  # Runs daily at midnight UTC

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    strategy:
      fail-fast: false
      matrix:
        agent: [ claude, codex ]

    env:
      STORAGE_DRIVER: vfs

    steps:
    - name: Check out repository
      uses: actions/checkout@v4

    - name: Login to GitHub Container Registry
      if: github.event_name != 'pull_request'
      uses: docker/login-action@v3
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}

    - name: Build image with buildah script
      id: build
      run: |
        # The build scripts print exactly one line on stdout: "<image>:<version>"
        REF=$(./devops/build-${{ matrix.agent }}.sh)
        echo "image=${REF%%:*}" >> "$GITHUB_OUTPUT"
        echo "version=${REF##*:}" >> "$GITHUB_OUTPUT"

    - name: Tag and push to GitHub Container Registry
      if: github.event_name != 'pull_request'
      env:
        IMAGE: ${{ steps.build.outputs.image }}
        VERSION: ${{ steps.build.outputs.version }}
      run: |
        REPO_NAME=$(echo "${{ github.repository }}" | tr '[:upper:]' '[:lower:]')

        buildah tag "$IMAGE" \
          "ghcr.io/$REPO_NAME/$IMAGE:$VERSION" \
          "ghcr.io/$REPO_NAME/$IMAGE:latest"

        buildah push "ghcr.io/$REPO_NAME/$IMAGE:$VERSION"
        buildah push "ghcr.io/$REPO_NAME/$IMAGE:latest"
